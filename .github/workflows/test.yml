name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # NOTE: Supabase env (URL + anon + service-role keys) is NOT set here.
  # The E2E / cross-browser jobs boot their OWN ephemeral local Supabase stack
  # (`supabase start`) per job and export its URL + keys into $GITHUB_ENV, which
  # gives every CI run a fully isolated database so runs can go parallel across
  # branches/PRs (no shared remote test DB). The `checks` job does not need a
  # Supabase connection except for the optional remote migration-applied probe,
  # which sets its own Management-API secrets locally in that job.
  NEXT_PUBLIC_SITE_URL: http://localhost:3001
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  VERIFICATION_ENCRYPTION_KEY: ci-test-encryption-key
  ADMIN_EMAIL_DOMAIN: test-ehl.com
  ADMIN_FALLBACK_EMAILS: e2e-admin@test-ehl.com
  SUPABASE_TEST_MODE: "true"
  GITHUB_TOKEN_EHL: ${{ secrets.GH_PAT }}
  GITHUB_ORG: european-hackathon-league
  # SMTP - optional, registration tests handle missing SMTP gracefully
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  SMTP_FROM: ${{ secrets.SMTP_FROM }}

jobs:
  # ─── Fast checks (lint, typecheck, unit tests) ────────────
  checks:
    name: Lint + Types + Unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Mapped here so the "Verify migrations" step's `if:` can detect whether
      # the Management-API secrets exist (secrets are not visible to `if:`
      # directly). Empty when unset -> the step is skipped.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TEST_REF: ${{ secrets.SUPABASE_TEST_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Verify the TEST Supabase has every migration applied (catches "code
      # merged but its migration never reached the DB"). The unit tests above
      # already fail if a migration file lacks a manifest entry; this step adds
      # the live-DB assertion. Skipped automatically if the Management-API
      # secrets are not configured, so it never blocks a fork/PR without them.
      - name: Verify migrations applied (test DB)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_TEST_REF != '' }}
        run: pnpm exec tsx scripts/check-migrations-applied.ts --ref "$SUPABASE_TEST_REF"

  # ─── E2E lifecycle test ───────────────────────────────────
  e2e:
    name: E2E Lifecycle
    runs-on: ubuntu-latest
    # 20 min headroom for install + `supabase start` (Docker pull/boot) +
    # Playwright browser + the full lifecycle suite. Email goes through a fake
    # transport (EMAIL_FAKE_TRANSPORT below), so there is no real-SMTP latency.
    timeout-minutes: 20
    needs: checks  # Only run E2E if fast checks pass
    # NO job-level concurrency group. Each run boots its OWN ephemeral local
    # Supabase stack (the "Start ephemeral Supabase" step below), so two runs can
    # never corrupt each other's data. That isolation is what lets E2E go fully
    # PARALLEL across branches/PRs again. (The previous `e2e-shared-test-db`
    # serialization existed only because all runs shared ONE remote test DB.)
    # The top-level `concurrency: tests-${{ github.ref }}` still supersedes
    # earlier runs of the SAME branch; cross-branch runs now overlap freely.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Boot a private Postgres + GoTrue + PostgREST + Storage stack in Docker
      # (preinstalled on ubuntu-latest). `supabase start` applies every
      # supabase/migrations/*.sql to this fresh DB; seed.sql is disabled in
      # config.toml (it needs auth.users + role triggers handled — see the seed
      # step). Keys printed by `supabase start` are the well-known, non-secret
      # local-dev keys; we capture them dynamically so they can never go stale.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start ephemeral Supabase (migrations applied)
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector

      - name: Export local Supabase env (override remote test DB for this job)
        run: |
          # supabase status -o env prints API_URL / ANON_KEY / SERVICE_ROLE_KEY.
          eval "$(supabase status -o env 2>/dev/null)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: Seed local stack
        run: pnpm test:seed-local

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Start dev server
        run: pnpm dev --port 3001 &
        env:
          NODE_ENV: development
          # Don't hit real SMTP from CI: tests that send email (verification
          # codes, broadcast) use a fake transport so they're fast and never
          # email real inboxes.
          EMAIL_FAKE_TRANSPORT: "true"

      - name: Wait for server
        run: npx wait-on http://localhost:3001 --timeout 60000

      - name: Run E2E lifecycle tests
        run: pnpm exec playwright test --project=lifecycle
        env:
          CI: true
          BASE_URL: http://localhost:3001
          EMAIL_FAKE_TRANSPORT: "true"

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/
          retention-days: 7

  # ─── Cross-browser smoke (Firefox + WebKit/Safari) ────────
  # Separate, NON-REQUIRED job so FF/Safari coverage never affects the required
  # "E2E Lifecycle" check or its 10-min budget. Surfaces Firefox/Safari
  # rendering & routing regressions; promote to a required check once stable.
  cross-browser:
    name: Cross-browser smoke (Firefox + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    continue-on-error: true
    # Runs only on pushes to main (post-merge), NOT on PRs — keeps PR CI fast
    # (lint + lifecycle only) and avoids this long job entangling the required
    # checks. FF/Safari regressions are surfaced on every main update.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Same ephemeral local stack as the e2e job: the smoke projects depend on
      # the `setup` project (global-setup creates auth users), which needs a real
      # Supabase. Boot a private one rather than pointing at the (now E2E-unused)
      # remote test DB.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      - name: Start ephemeral Supabase (migrations applied)
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector

      - name: Export local Supabase env
        run: |
          eval "$(supabase status -o env 2>/dev/null)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: Seed local stack
        run: pnpm test:seed-local

      - name: Install Playwright browsers (Firefox + WebKit)
        run: pnpm exec playwright install firefox webkit chromium --with-deps

      - name: Start dev server
        run: pnpm dev --port 3001 &
        env:
          NODE_ENV: development
          EMAIL_FAKE_TRANSPORT: "true"

      - name: Wait for server
        run: npx wait-on http://localhost:3001 --timeout 60000

      - name: Run smoke tests on Firefox + WebKit
        run: pnpm exec playwright test --project=smoke-firefox --project=smoke-webkit
        env:
          CI: true
          BASE_URL: http://localhost:3001
          EMAIL_FAKE_TRANSPORT: "true"

      - name: Stop ephemeral Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Upload cross-browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: playwright-report/
          retention-days: 7
